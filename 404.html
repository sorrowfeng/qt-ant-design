<script>
  (function () {
    try {
      var saved = localStorage.getItem('qad-theme');
      var theme = saved === 'dark' || saved === 'light' ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* keep light */ }
  })();
</script>

  <style>
:root {
  color-scheme: light;
  --brand: #1677ff;
  --brand-hover: #4096ff;
  --ink: rgba(0, 0, 0, 0.88);
  --text: rgba(0, 0, 0, 0.72);
  --muted: rgba(0, 0, 0, 0.48);
  --line: #f0f0f0;
  --line-strong: #d9d9d9;
  --bg: #fff;
  --shadow: 0 8px 24px rgba(18, 35, 64, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--brand); }
.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 1000;
  transform: translateY(-140%);
  padding: 8px 12px;
  border-radius: 6px;
  color: #fff;
  background: var(--brand);
  box-shadow: var(--shadow);
  transition: transform .16s ease;
}
.skip-link:focus {
  transform: translateY(0);
  color: #fff;
  outline: none;
}
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(255, 255, 255, 0.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 190px;
  font-weight: 700;
  font-size: 18px;
}
.brand img { width: 32px; height: 32px; }
.nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.nav a {
  padding: 8px 12px;
  border-radius: 6px;
  color: var(--text);
}
.nav a:hover {
  color: var(--brand);
  background: #e6f4ff;
}
main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 48px 20px;
  background:
    radial-gradient(560px 300px at 82% 0%, rgba(22, 119, 255, 0.10), transparent 72%),
    radial-gradient(480px 280px at 8% 100%, rgba(22, 119, 255, 0.06), transparent 70%);
}
.result {
  max-width: 560px;
  text-align: center;
}
.result-code {
  font-size: clamp(96px, 18vw, 160px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0;
  background: linear-gradient(135deg, #4096ff 0%, #1677ff 60%, #0958d9 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.result h1 {
  margin: 12px 0 8px;
  font-size: 24px;
}
.result p {
  margin: 0;
  color: var(--text);
}
.result-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 28px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 8px 18px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font-weight: 600;
  transition: border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease;
}
.btn.primary {
  border-color: var(--brand);
  background: var(--brand);
  color: #fff;
  box-shadow: 0 8px 18px rgba(22, 119, 255, 0.18);
}
.btn.primary:hover { background: var(--brand-hover); color: #fff; }
.footer {
  border-top: 1px solid var(--line);
  padding: 24px 32px;
  color: var(--muted);
  text-align: center;
}
@media (max-width: 680px) {
  .site-header {
    height: auto;
    min-height: 64px;
    align-items: flex-start;
    flex-direction: column;
    padding: 10px 20px 0;
  }
  .brand { min-width: 0; min-height: 44px; }
  .nav {
    width: calc(100% + 40px);
    margin: 0 -20px;
    padding: 0 20px 10px;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { flex: 0 0 auto; padding: 6px 10px; white-space: nowrap; }
  .theme-toggle { position: absolute; top: 12px; right: 20px; }
}

  /* ---- theme toggle ---- */
.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  margin-left: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease, background .16s ease;
}
.theme-toggle:hover,
.theme-toggle:focus-visible {
  color: var(--brand);
  border-color: #91caff;
  outline: none;
}
html[data-theme="dark"] .theme-toggle:hover,
html[data-theme="dark"] .theme-toggle:focus-visible { border-color: #15325b; }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-sun { display: none; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
/* ---- dark theme ---- */
html[data-theme="dark"] {
  color-scheme: dark;
  --brand: #1668dc;
  --brand-hover: #3c89e8;
  --ink: rgba(255, 255, 255, 0.88);
  --text: rgba(255, 255, 255, 0.72);
  --muted: rgba(255, 255, 255, 0.45);
  --line: #303030;
  --line-strong: #424242;
  --bg: #141414;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
html[data-theme="dark"] .site-header { background: rgba(20, 20, 20, 0.94); }
html[data-theme="dark"] .nav a:hover { background: #111a2c; }
html[data-theme="dark"] main {
  background:
    radial-gradient(560px 300px at 82% 0%, rgba(60, 137, 232, 0.12), transparent 72%),
    radial-gradient(480px 280px at 8% 100%, rgba(60, 137, 232, 0.07), transparent 70%);
}
html[data-theme="dark"] .btn { background: #1f1f1f; }

<script>
  (function () {
    var root = document.documentElement;
    var button = document.getElementById('theme-toggle');
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    function currentTheme() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
    function sync(theme) {
      if (button) button.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
      if (metaTheme) metaTheme.setAttribute('content', theme === 'dark' ? '#141414' : '#1677ff');
    }
    sync(currentTheme());
    if (button) {
      button.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('qad-theme', next); } catch (e) { /* private mode */ }
        sync(next);
      });
    }
  })();
</script>
